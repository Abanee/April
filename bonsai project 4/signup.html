<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Bonsai Nursery & Care Workshop</title>
  <script>
    (function(){
      var t=localStorage.getItem('bonsai-theme'),p=window.matchMedia('(prefers-color-scheme:dark)').matches;
      if(t==='dark'||(t===null&&p))document.documentElement.classList.add('dark');
      var d=localStorage.getItem('bonsai-dir')||'ltr';
      document.documentElement.setAttribute('dir',d);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500" rel="stylesheet" />
  <link rel="icon" type="image/png" href="src/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{cormorant:['"Cormorant Garamond"','Georgia','serif'],dm:['"DM Sans"','system-ui','sans-serif'],mono:['"DM Mono"','monospace']}}}}</script>
<style>
    body{font-family:'DM Sans',system-ui,sans-serif; overflow-x: hidden;}
    .font-cormorant{font-family:'Cormorant Garamond',Georgia,serif;}
    .font-mono-dm{font-family:'DM Mono',monospace;}
    [data-sr]{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);}
    [data-sr].sr-visible{opacity:1;transform:translateY(0);}
    
    /* ── Split layout backgrounds ── */
    .left-panel {
      background: linear-gradient(160deg, #0c1a0e 0%, #1a3320 50%, #0c1a0e 100%);
    }

    /* ── Floating bonsai animation ── */
    @keyframes floatY {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }
    .float-bonsai { animation: floatY 8s ease-in-out infinite; }

    /* ── Enso ring spin ── */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .enso-spin { animation: spinSlow 40s linear infinite; }

    /* ── Input focus ring ── */
    .field-input {
      transition: border-color .2s, box-shadow .2s;
    }
    .field-input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5,150,105,.12);
    }

    /* ── Button ── */
    .btn-submit {
      transition: background .2s, transform .15s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(5,150,105,.4);
    }

    /* ── Ripple on card load ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-appear { animation: cardIn .55s cubic-bezier(.4,0,.2,1) forwards; }

    /* ── Decorative particles ── */
    @keyframes drift {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: .6; }
      100% { transform: translateY(-80px) translateX(20px) rotate(180deg); opacity: 0; }
    }
    .particle { animation: drift linear infinite; position: absolute; border-radius: 50%; }
</style>
</head>

<body class="bg-stone-50 dark:bg-stone-950 text-stone-800 dark:text-stone-200 transition-colors duration-300 antialiased min-h-screen">

<!-- THEME TOGGLE -->


<div class="min-h-screen flex items-center justify-center p-6 bg-stone-100 dark:bg-stone-950">
    <div class="w-full max-w-[440px] card-appear">



      <div class="bg-white dark:bg-stone-900 rounded-[2rem] shadow-xl border border-stone-100 dark:border-stone-800 p-8 sm:p-10">
        <div class="mb-8 text-center">
          <a href="index.html" class="inline-flex items-center justify-center gap-2.5 group mb-6 transition-transform hover:scale-[1.02]">
            <div class="w-10 h-10 group-hover:scale-110 transition-transform">
              <img src="src/logo.png" alt="Bonsai Nursery Logo" class="w-full h-full object-contain">
            </div>
            <div class="leading-tight text-left">
              <span class="font-cormorant text-[1.05rem] font-semibold text-stone-800 dark:text-stone-100 block leading-none tracking-wide">Bonsai Nursery</span>
              <span class="font-mono-dm text-[0.58rem] tracking-[0.2em] uppercase text-emerald-700 dark:text-emerald-500">& Care Workshop</span>
            </div>
          </a>
          <h2 class="font-cormorant text-3xl font-bold text-stone-800 dark:text-stone-100 mb-1">Create Account</h2>
          <p class="text-stone-500 dark:text-stone-400 text-sm">Grow your journey with us today.</p>
        </div>

        <form id="signupForm" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2">Full Name</label>
            <input type="text" placeholder="Arjun Sharma" class="field-input w-full px-4 py-3.5 rounded-xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2">Email Address</label>
            <input type="email" placeholder="you@example.com" class="field-input w-full px-4 py-3.5 rounded-xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2">Password</label>
            <input type="password" placeholder="••••••••" class="field-input w-full px-4 py-3.5 rounded-xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-sm" />
          </div>
          
          <button type="submit" class="btn-submit w-full py-4 rounded-xl bg-emerald-700 hover:bg-emerald-600 text-white font-semibold text-sm mt-4">
            Create My Account
          </button>
        </form>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-stone-100 dark:bg-stone-800"></div>
          <span class="text-xs text-stone-400 dark:text-stone-600">or sign up with</span>
          <div class="flex-1 h-px bg-stone-100 dark:bg-stone-800"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button class="flex items-center justify-center gap-2.5 py-3 rounded-xl border border-stone-200 dark:border-stone-700 text-sm font-medium hover:bg-stone-50 dark:hover:bg-stone-800 transition-all">
            <svg class="w-4.5 h-4.5 w-[18px] h-[18px]" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button class="flex items-center justify-center gap-2.5 py-3 rounded-xl border border-stone-200 dark:border-stone-700 text-sm font-medium hover:bg-stone-50 dark:hover:bg-stone-800 transition-all">
            <svg class="w-4.5 h-4.5 w-[18px] h-[18px] fill-current" viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            Apple
          </button>
        </div>
        <!-- Sign in link moved inside -->
        <p class="text-center text-sm text-stone-500 dark:text-stone-400 mt-8 pt-6 border-t border-stone-100 dark:border-stone-800">
          Already have an account?
          <a href="login.html" class="text-emerald-700 dark:text-emerald-400 font-semibold hover:underline">Sign in here →</a>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="src/js/main.js"></script>

</body>
</html>
