<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Bonsai Nursery & Care Workshop</title>
  <script>
    (function(){
      var t=localStorage.getItem('bonsai-theme'),p=window.matchMedia('(prefers-color-scheme:dark)').matches;
      if(t==='dark'||(t===null&&p))document.documentElement.classList.add('dark');
      var d=localStorage.getItem('bonsai-dir')||'ltr';
      document.documentElement.setAttribute('dir',d);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500" rel="stylesheet" />
  <link rel="icon" type="image/png" href="src/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{cormorant:['"Cormorant Garamond"','Georgia','serif'],dm:['"DM Sans"','system-ui','sans-serif'],mono:['"DM Mono"','monospace']}}}}</script>
<style>
    body{font-family:'DM Sans',system-ui,sans-serif; overflow-x: hidden;}
    .font-cormorant,.font-cormorant{font-family:'Cormorant Garamond',Georgia,serif;}
    .font-mono-dm{font-family:'DM Mono',monospace;}
    [data-sr]{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1);}
    [data-sr].sr-visible{opacity:1;transform:translateY(0);}
    [data-sr][data-delay="100"]{transition-delay:100ms}[data-sr][data-delay="200"]{transition-delay:200ms}[data-sr][data-delay="300"]{transition-delay:300ms}[data-sr][data-delay="400"]{transition-delay:400ms}[data-sr][data-delay="500"]{transition-delay:500ms}
    #navbar{transition:all .4s cubic-bezier(.16,1,.3,1);}
    #navbar.nav-scrolled{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(0,0,0,.06),0 4px 24px rgba(0,0,0,.05);}
    html:not(.dark) #navbar.nav-scrolled{background:rgba(250,250,249,.94);}
    html.dark #navbar.nav-scrolled{background:rgba(12,10,9,.94);}
    .mobile-panel{transition:transform .4s cubic-bezier(.16,1,.3,1);}
    .btn-cta{transition:background .25s ease,transform .2s ease,box-shadow .25s ease;}
    .btn-cta:hover{transform:translateY(-2px);}
    .nav-link{position:relative;}
    .nav-link::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1.5px;background:#059669;transition:width .3s ease;}
    html[dir="rtl"] .nav-link::after{left:auto;right:0;}
    .nav-link:hover::after,.nav-link.active::after{width:100%;}
    .nav-link.active{color:#059669;}
    html.dark .nav-link.active{color:#34d399;}
    #progress-bar{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,#059669,#34d399);z-index:9999;width:0;}
    html[dir="rtl"] #progress-bar{left:auto;right:0;}

    .font-cormorant { font-family: 'Cormorant Garamond', Georgia, serif; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    /* ── Split layout backgrounds ── */
    .left-panel {
      background: linear-gradient(160deg, #0c1a0e 0%, #1a3320 50%, #0c1a0e 100%);
    }

    /* ── Floating bonsai animation ── */
    @keyframes floatY {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }
    .float-bonsai { animation: floatY 8s ease-in-out infinite; }

    /* ── Enso ring spin ── */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .enso-spin { animation: spinSlow 40s linear infinite; }

    /* ── Scroll reveal ── */
    [data-sr] { opacity:0; transform:translateY(20px); transition:opacity .6s ease,transform .6s ease; }
    [data-sr].sr-visible { opacity:1; transform:translateY(0); }
    [data-sr][data-delay="100"]{transition-delay:100ms}
    [data-sr][data-delay="200"]{transition-delay:200ms}
    [data-sr][data-delay="300"]{transition-delay:300ms}

    /* ── Input focus ring ── */
    .field-input {
      transition: border-color .2s, box-shadow .2s;
    }
    .field-input:focus {
      outline: none;
      border-color: #059669;
      box-shadow: 0 0 0 3px rgba(5,150,105,.12);
    }
    .field-input.error {
      border-color: #f87171;
      box-shadow: 0 0 0 3px rgba(248,113,113,.12);
    }
    .field-input.success {
      border-color: #34d399;
    }

    /* ── Button ── */
    .btn-submit {
      transition: background .2s, transform .15s, box-shadow .2s;
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px rgba(5,150,105,.4);
    }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ── Ripple on card load ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-appear { animation: cardIn .55s cubic-bezier(.4,0,.2,1) forwards; }

    /* ── Shimmer loader ── */
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    .shimmer-btn {
      background: linear-gradient(90deg, #059669 25%, #10b981 50%, #059669 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    /* ── Decorative particles ── */
    @keyframes drift {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: .6; }
      100% { transform: translateY(-80px) translateX(20px) rotate(180deg); opacity: 0; }
    }
    .particle { animation: drift linear infinite; position: absolute; border-radius: 50%; }
  </style>
</head>

<body class="bg-stone-50 dark:bg-stone-950 text-stone-800 dark:text-stone-200 transition-colors duration-300 antialiased min-h-screen">

<!-- ═══════════════════════════════════════════════
     THEME TOGGLE  (top-right, always visible)
════════════════════════════════════════════════ -->


<div class="min-h-screen flex items-center justify-center p-6 bg-stone-100 dark:bg-stone-950">
    <div class="w-full max-w-[420px] card-appear">



      <!-- Card -->
      <div class="bg-white dark:bg-stone-900 rounded-3xl shadow-xl dark:shadow-stone-950/50 border border-stone-100 dark:border-stone-800 p-8 sm:p-10">

        <!-- Heading -->
        <div class="mb-8 text-center">
          <a href="index.html" class="inline-flex items-center justify-center gap-2.5 group mb-6 transition-transform hover:scale-[1.02]">
            <div class="w-10 h-10 group-hover:scale-110 transition-transform">
              <img src="src/logo.png" alt="Bonsai Nursery Logo" class="w-full h-full object-contain">
            </div>
            <div class="leading-tight text-left">
              <span class="font-cormorant text-[1.05rem] font-semibold text-stone-800 dark:text-stone-100 block leading-none tracking-wide">Bonsai Nursery</span>
              <span class="font-mono-dm text-[0.58rem] tracking-[0.2em] uppercase text-emerald-700 dark:text-emerald-500">& Care Workshop</span>
            </div>
          </a>
          <h2 class="font-cormorant text-3xl font-bold text-stone-800 dark:text-stone-100 mb-1">Sign In</h2>
          <p class="text-stone-500 dark:text-stone-400 text-sm">Access your personal bonsai dashboard.</p>
        </div>

        <!-- General error -->
        <div id="generalError" class="hidden mb-5 flex items-start gap-3 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm px-4 py-3 rounded-xl">
          <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span></span>
        </div>

        <!-- FORM -->
        <form id="loginForm" novalidate class="space-y-5">

          <!-- Email -->
          <div>
            <label for="email" class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider mb-2">
              Email Address
            </label>
            <div class="relative">
              <div class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 dark:text-stone-500 pointer-events-none">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </div>
              <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                class="field-input w-full pl-11 pr-4 py-3.5 rounded-xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-800 dark:text-stone-200 text-sm placeholder:text-stone-300 dark:placeholder:text-stone-600"
              />
            </div>
            <p id="emailError" class="hidden mt-2 text-xs text-red-500 flex items-center gap-1">
              <svg class="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
              <span></span>
            </p>
          </div>

          <!-- Password -->
          <div>
            <div class="mb-2">
              <label for="password" class="block text-xs font-semibold text-stone-500 dark:text-stone-400 uppercase tracking-wider">
                Password
              </label>
            </div>
            <div class="relative">
              <div class="absolute left-4 top-1/2 -translate-y-1/2 text-stone-400 dark:text-stone-500 pointer-events-none">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </div>
              <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="••••••••"
                class="field-input w-full pl-11 pr-12 py-3.5 rounded-xl bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 text-stone-800 dark:text-stone-200 text-sm placeholder:text-stone-300 dark:placeholder:text-stone-600"
              />
              <!-- Toggle password visibility -->
              <button
                type="button"
                id="togglePassword"
                class="absolute right-3.5 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 rounded-lg transition-colors"
                aria-label="Toggle password visibility">
                <!-- Eye open (password hidden) -->
                <svg id="eyeOpen" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                <!-- Eye closed (password visible) -->
                <svg id="eyeClosed" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                </svg>
              </button>
            </div>
            <div class="flex justify-end mt-1.5">
              <a href="#" class="text-[0.65rem] text-emerald-700 dark:text-emerald-400 hover:underline font-medium">
                Forgot password?
              </a>
            </div>
            <p id="passwordError" class="hidden mt-2 text-xs text-red-500 flex items-center gap-1">
              <svg class="w-3 h-3 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
              <span></span>
            </p>
          </div>

          <!-- Remember me -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2.5 cursor-pointer group">
              <div class="relative">
                <input type="checkbox" id="rememberMe" class="sr-only peer" />
                <div class="w-9 h-5 rounded-full bg-stone-200 dark:bg-stone-700 peer-checked:bg-emerald-600 transition-colors"></div>
                <div class="absolute left-0.5 top-0.5 w-4 h-4 rounded-full bg-white shadow transition-transform peer-checked:translate-x-4"></div>
              </div>
              <span class="text-xs text-stone-500 dark:text-stone-400 font-medium group-hover:text-stone-700 dark:group-hover:text-stone-300 transition-colors">
                Remember me for 30 days
              </span>
            </label>
          </div>

          <!-- Submit -->
          <button
            id="submitBtn"
            type="submit"
            class="btn-submit w-full py-4 px-6 rounded-xl bg-emerald-700 hover:bg-emerald-600 disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold text-sm mt-2 flex items-center justify-center gap-2">
            Sign In to Portal
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
            </svg>
          </button>

          <!-- Demo hint -->
          <div class="flex items-start gap-2.5 bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900 rounded-xl px-4 py-3 mt-1">
            <svg class="w-3.5 h-3.5 text-emerald-600 dark:text-emerald-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <p class="text-xs text-emerald-700 dark:text-emerald-400 leading-relaxed">
              <strong>Demo:</strong> Enter any valid email &amp; a password of 6+ characters to access the dashboard.
            </p>
          </div>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-7">
          <div class="flex-1 h-px bg-stone-100 dark:bg-stone-800"></div>
          <span class="text-xs text-stone-400 dark:text-stone-600 font-medium">or</span>
          <div class="flex-1 h-px bg-stone-100 dark:bg-stone-800"></div>
        </div>

        <!-- Social / alternate sign-in -->
        <div class="grid grid-cols-2 gap-4">
          <button class="w-full flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl border border-stone-200 dark:border-stone-700 text-stone-600 dark:text-stone-400 text-sm font-medium hover:bg-stone-50 dark:hover:bg-stone-800 transition-all duration-200">
            <svg class="w-4.5 h-4.5 w-[18px] h-[18px]" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          <button class="w-full flex items-center justify-center gap-2.5 py-3 px-4 rounded-xl border border-stone-200 dark:border-stone-700 text-stone-600 dark:text-stone-400 text-sm font-medium hover:bg-stone-50 dark:hover:bg-stone-800 transition-all duration-200">
            <svg class="w-4.5 h-4.5 w-[18px] h-[18px] fill-current" viewBox="0 0 384 512" xmlns="http://www.w3.org/2000/svg">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            Apple
          </button>
        </div>

        <!-- Sign up link moved inside -->
        <p class="text-center text-sm text-stone-500 dark:text-stone-400 mt-8 pt-6 border-t border-stone-100 dark:border-stone-800">
          New to the nursery?
          <a href="signup.html" class="text-emerald-700 dark:text-emerald-400 font-semibold hover:underline">Create an account →</a>
        </p>

      </div>

    </div>
  </div>
</div>

<!-- Scripts -->
<script src="src/js/main.js"></script>
<script src="src/js/auth.js"></script>

</body>
</html>
