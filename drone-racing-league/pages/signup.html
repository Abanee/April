<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign Up — DRL Drone Racing League</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/main.css"/>
<script src="../assets/js/theme.js"></script>
</head>
<body>

<!-- ── AUTH SECTION ── -->
<section class="auth-section">
  <div class="auth-bg"></div>
  <div class="auth-card" style="max-width:500px">
    <div class="auth-header">
      <h2 class="display">JOIN THE <span class="glow-orange">LEAGUE</span></h2>
      <p>Start your journey from rookie to elite FPV racing legend.</p>
    </div>

    <form class="auth-form" action="login.html">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" class="auth-input" placeholder="Alex" required>
        </div>
        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" class="auth-input" placeholder="Chen" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="auth-input" placeholder="pilot@drlapex.com" required>
      </div>
      
      <div class="form-group">
        <label for="pilot-name">Pilot Handle (Username)</label>
        <input type="text" id="pilot-name" class="auth-input" placeholder="Apex_FPV" required>
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
      </div>

      <div style="display:flex;align-items:flex-start;gap:8px;margin-top:4px">
        <input type="checkbox" id="terms" style="margin-top:3px;accent-color:var(--orange)" required>
        <label for="terms" style="font-size:12px;color:var(--text-dim);cursor:pointer;text-transform:none;letter-spacing:normal;line-height:1.4">
          I agree to the <a href="#" style="color:var(--orange);text-decoration:none">Terms of Service</a> and <a href="#" style="color:var(--orange);text-decoration:none">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn-primary auth-btn">Initialize Pilot Profile</button>
    </form>

    <div class="auth-divider">Or join with</div>

    <div class="social-grid">
      <a href="#" class="btn-social">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.9 3.24-2.16 4.41-1.32 1.32-3.24 2.16-5.68 2.16-4.2 0-7.68-3.32-7.68-7.68s3.48-7.68 7.68-7.68c2.4 0 4.14.9 5.34 2.04l2.58-2.58c-2.4-2.28-5.46-3.66-9.6-3.66-6.6 0-12 5.4-12 12s5.4 12 12 12c4.08 0 7.26-1.32 9.72-3.84 2.4-2.4 3.12-5.76 3.12-8.58 0-.84-.06-1.56-.18-2.28l-11.22 0z"/></svg>
        Google
      </a>
      <a href="#" class="btn-social">
        <svg width="18" height="18" viewBox="0 0 256 315" fill="currentColor" preserveAspectRatio="xMidYMid"><path d="M213.803 167.03c.442 47.58 41.74 63.413 42.197 63.615-.335.99-6.63 22.695-21.986 45.143-13.333 19.38-27.18 38.682-48.867 39.083-21.312.39-28.163-12.607-52.604-12.607-24.425 0-31.988 12.217-52.593 13.013-20.915.795-36.634-21.01-50.04-40.48C10.51 251.64.015 195.968.015 143.08c0-84.34 54.72-128.847 108.415-128.847 27.973 0 54.348 19.333 71.493 19.333 17.11 0 48.432-23.36 82.023-23.36 14.15 0 53.642 5.105 78.89 42.112-2.036 1.258-47.054 27.42-46.544 86.8c.49 72.072 64.137 96.05 65.342 96.533zM154.673 26.69c12.518-15.147 20.94-36.19 18.66-57.19-18.06.743-39.815 12.008-52.76 27.158-11.616 13.434-21.785 34.823-19.034 55.335 19.982 1.547 40.59-10.156 53.133-25.303z"/></svg>
        Apple ID
      </a>
    </div>

    <div class="auth-footer">
      Already a member? <a href="login.html">Sign In</a>
    </div>
  </div>
</section>

</body>
</html>
