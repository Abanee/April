<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sign Up — DRL Drone Racing League</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/css/main.css"/>
<link rel="icon" type="image/png" href="../logo.png"/>
<script src="../assets/js/theme.js"></script>
</head>
<body>

<!-- ── AUTH SECTION ── -->
<section class="auth-section">
  <div class="auth-bg"></div>
  <div class="auth-card" style="max-width:500px">
    <div class="auth-header">
      <a href="../index.html" style="display:inline-flex;align-items:center;gap:12px;text-decoration:none;margin-bottom:24px">
        <img src="../logo.png" alt="DRL Logo" style="height:48px;width:auto">
        <span class="display" style="font-size:32px;color:var(--text)">DRL<span style="color:var(--orange)">.</span>APEX</span>
      </a>
      <h2 class="display">JOIN THE <span style="color:var(--orange)">LEAGUE</span></h2>
      <p>Start your journey from rookie to elite FPV racing legend.</p>
    </div>

    <form class="auth-form" action="login.html">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group">
          <label for="fname">First Name</label>
          <input type="text" id="fname" class="auth-input" placeholder="Alex" required>
        </div>
        <div class="form-group">
          <label for="lname">Last Name</label>
          <input type="text" id="lname" class="auth-input" placeholder="Chen" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="auth-input" placeholder="pilot@drlapex.com" required>
      </div>
      
      <div class="form-group">
        <label for="pilot-name">Pilot Handle (Username)</label>
        <input type="text" id="pilot-name" class="auth-input" placeholder="Apex_FPV" required>
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password" class="auth-input" placeholder="••••••••" required>
      </div>

      <div style="display:flex;align-items:flex-start;gap:8px;margin-top:4px">
        <input type="checkbox" id="terms" style="margin-top:3px;accent-color:var(--orange)" required>
        <label for="terms" style="font-size:12px;color:var(--text-dim);cursor:pointer;text-transform:none;letter-spacing:normal;line-height:1.4">
          I agree to the <a href="#" style="color:var(--orange);text-decoration:none">Terms of Service</a> and <a href="#" style="color:var(--orange);text-decoration:none">Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn-primary auth-btn">Create Pilot Profile</button>
    </form>

    <div class="auth-divider">Or join with</div>

    <div class="social-grid">
      <a href="#" class="btn-social">
        <svg width="20" height="20" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Google
      </a>
      <a href="#" class="btn-social">
        <svg width="20" height="20" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-49.1-141.9c16.1-19.5 27-46.7 24.5-74-23.7 1-52.1 15.6-69.1 35.1-15.1 17.2-28.5 44.9-24.9 71.3 25.7 2 52.3-13.8 69.5-32.4z"/></svg>
        Apple ID
      </a>
    </div>

    <div class="auth-footer">
      Already a member? <a href="login.html">Sign In</a>
    </div>
  </div>
</section>

</body>
</html>
